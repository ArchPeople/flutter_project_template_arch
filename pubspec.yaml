name: flutter_project_template_arch
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.0.1
  envied: ^1.3.2
  envied_generator: ^1.3.2
  bloc: ^9.2.0
  equatable: ^2.0.8
  dio: ^5.9.0
  fpdart: ^1.2.0
  get_it: ^9.2.0
  shared_preferences: ^2.5.4

dev_dependencies:
  build_runner: ^2.10.4
  flutter_launcher_icons: "^0.14.4"
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon/icon.png"
  adaptapive_icon_background: "#ffffff"

flutter:
  assets:
    - assets/images/
  uses-material-design: true
