name: flutter_project_template_arch
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

# Supported Flutter: 3.41.0 - 3.41.7
environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9
  flutter_bloc: 9.1.1
  go_router: 17.2.1
  envied: 1.3.4
  envied_generator: 1.3.4
  bloc: 9.2.0
  equatable: 2.0.8
  dio: 5.9.2
  fpdart: 1.2.0
  get_it: 9.2.1
  shared_preferences: 2.5.5

dev_dependencies:
  build_runner: 2.13.1
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  change_app_package_name: 1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon/icon.png"
  adaptapive_icon_background: "#ffffff"

flutter:
  assets:
    - assets/images/
  uses-material-design: true
